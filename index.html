<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ব্যানার এডিটর</title>
    <style>
        body { font-family: 'Arial', sans-serif; background-color: #f0f2f5; display: flex; flex-direction: column; align-items: center; padding: 20px; }
        .container { background: #fff; padding: 20px; border-radius: 12px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); max-width: 450px; width: 100%; text-align: center; }
        .input-group { text-align: left; margin-bottom: 15px; }
        label { font-weight: bold; display: block; margin-bottom: 5px; }
        input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; }
        
        .btn-generate {
            width: 100%; padding: 15px; border: none; border-radius: 8px;
            background: linear-gradient(45deg, #ff4b2b, #ff8c00);
            color: white; font-size: 18px; font-weight: bold; cursor: pointer;
        }
        
        canvas { max-width: 100%; height: auto; border-radius: 8px; margin-top: 20px; display: none; border: 1px solid #ddd; }
        .download-btn { display: none; margin-top: 15px; padding: 12px 25px; background: #27ae60; color: white; text-decoration: none; border-radius: 6px; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <h2>ব্যানার ইনফো পরিবর্তন</h2>
    
    <div class="input-group">
        <label>নতুন নাম লিখুন:</label>
        <input type="text" id="userName" placeholder="নাম লিখুন">
    </div>
    
    <div class="input-group">
        <label>নতুন ব্যাচ লিখুন:</label>
        <input type="text" id="batchNo" placeholder="যেমন: ২০২৩">
    </div>
    
    <div class="input-group">
        <label>আপনার ছবি বেছে নিন:</label>
        <input type="file" id="imageInput" accept="image/*">
    </div>
    
    <button class="btn-generate" onclick="createBanner()">ব্যানার আপডেট করুন</button>
</div>

<canvas id="canvas" width="1024" height="1024"></canvas>
<a id="downloadBtn" class="download-btn">ডাউনলোড করুন</a>

<script>
    function createBanner() {
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const name = document.getElementById('userName').value;
        const batch = document.getElementById('batchNo').value;
        const fileInput = document.getElementById('imageInput');

        if (!name || !batch || !fileInput.files[0]) {
            alert("দয়া করে সব তথ্য দিন!");
            return;
        }

        const template = new Image();
        template.src = 'template.jpg'; // আপনার মূল ছবির নাম এটি হতে হবে

        template.onload = function() {
            // ১. মূল ছবি ড্র করা
            ctx.drawImage(template, 0, 0, 1024, 1024);

            // ২. আগের তথ্যগুলো মুছে ফেলা (Hide original text)
            // ব্যাচ বক্সের জায়গাটা সাদা করে দিচ্ছি
            ctx.fillStyle = "#fcfcfc"; // ছবির ব্যাকগ্রাউন্ড কালার অনুযায়ী
            ctx.fillRect(105, 475, 125, 65); // ব্যাচ এরিয়া
            ctx.fillRect(235, 475, 400, 65); // নাম এরিয়া

            // ৩. ইউজারের ছবি ড্র করা
            const reader = new FileReader();
            reader.onload = function(event) {
                const userImg = new Image();
                userImg.onload = function() {
                    const x=148, y=195, w=250, h=275;
                    ctx.save();
                    ctx.beginPath();
                    ctx.rect(x, y, w, h);
                    ctx.clip();
                    ctx.drawImage(userImg, x, y, w, h);
                    ctx.restore();

                    // ৪. নতুন ব্যাচ বক্স (Gradient)
                    const grad = ctx.createLinearGradient(110, 480, 230, 530);
                    grad.addColorStop(0, "#ff4b2b");
                    grad.addColorStop(1, "#ff8c00");
                    ctx.fillStyle = grad;
                    
                    drawRoundedRect(ctx, 110, 480, 115, 52, 8);
                    ctx.fill();

                    // ৫. নতুন ব্যাচ টেক্সট
                    ctx.fillStyle = "white";
                    ctx.font = "bold 28px Arial";
                    ctx.textAlign = "center";
                    ctx.fillText(batch, 167, 516);

                    // ৬. নতুন নাম টেক্সট
                    ctx.fillStyle = "#333";
                    ctx.font = "bold 35px Arial";
                    ctx.textAlign = "left";
                    ctx.fillText(name, 240, 516);

                    // রেজাল্ট দেখানো
                    canvas.style.display = "block";
                    const dl = document.getElementById('downloadBtn');
                    dl.style.display = "inline-block";
                    dl.href = canvas.toDataURL("image/jpeg", 1.0);
                    dl.download = "updated_banner.jpg";
                };
                userImg.src = event.target.result;
            };
            reader.readAsDataURL(fileInput.files[0]);
        };
    }

    function drawRoundedRect(ctx, x, y, width, height, radius) {
        ctx.beginPath();
        ctx.moveTo(x + radius, y);
        ctx.lineTo(x + width - radius, y);
        ctx.quadraticCurveTo(x + width, y, x + width, y + radius);
        ctx.lineTo(x + width, y + height - radius);
        ctx.quadraticCurveTo(x + width, y + height, x + width - radius, y + height);
        ctx.lineTo(x + radius, y + height);
        ctx.quadraticCurveTo(x, y + height, x, y + height - radius);
        ctx.lineTo(x, y + radius);
        ctx.quadraticCurveTo(x, y, x + radius, y);
        ctx.closePath();
    }
</script>

</body>
</html>

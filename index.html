<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ইফতার মাহফিল ব্যানার জেনারেটর</title>
    <style>
        /* CSS Style */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f2f5;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            margin: 0;
        }
        .container {
            background: #fff;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            max-width: 500px;
            width: 100%;
            text-align: center;
        }
        h2 { color: #2c3e50; margin-bottom: 20px; }
        .input-group { margin-bottom: 20px; }
        input {
            width: 90%;
            padding: 12px;
            margin: 8px 0;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
        }
        canvas {
            width: 100%;
            max-width: 400px;
            height: auto;
            border: 2px solid #e67e22;
            border-radius: 10px;
            margin-top: 15px;
            display: block;
        }
        .btn-download {
            background: linear-gradient(to right, #ff8c00, #ff4500);
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            margin-top: 20px;
            transition: 0.3s;
            box-shadow: 0 4px 15px rgba(255, 69, 0, 0.3);
        }
        .btn-download:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 69, 0, 0.4);
        }
    </style>
</head>
<body>

<div class="container">
    <h2>ব্যানার ডিজাইন করুন</h2>
    
    <div class="input-group">
        <input type="text" id="userName" placeholder="আপনার নাম লিখুন">
        <input type="text" id="userBatch" placeholder="আপনার ব্যাচ (যেমন: ২০১৫)">
        <p style="font-size: 12px; color: #666;">আপনার ছবি আপলোড করুন:</p>
        <input type="file" id="userPhoto" accept="image/*">
    </div>

    <canvas id="bannerCanvas" width="1000" height="1000" style="display:none;"></canvas>
    <canvas id="previewCanvas" width="1000" height="1000"></canvas>
    
    <button class="btn-download" id="downloadBtn">ডাউনলোড / শেয়ার করুন</button>
</div>

<script>
    const canvas = document.getElementById('bannerCanvas');
    const previewCanvas = document.getElementById('previewCanvas');
    const ctx = canvas.getContext('2d');
    const pCtx = previewCanvas.getContext('2d');

    const userNameInput = document.getElementById('userName');
    const userBatchInput = document.getElementById('userBatch');
    const userPhotoInput = document.getElementById('userPhoto');
    const downloadBtn = document.getElementById('downloadBtn');

    const templateImg = new Image();
    // আপনার টেমপ্লেট ইমেজের সোর্স এখানে দিন
    templateImg.src = 'template.jpg'; 

    templateImg.onload = () => {
        updateCanvas();
    };

    function updateCanvas() {
        // মেইন ক্যানভাস ক্লিয়ার করে টেমপ্লেট ড্র করা
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.drawImage(templateImg, 0, 0, canvas.width, canvas.height);

        const name = userNameInput.value || "আপনার নাম";
        const batch = userBatchInput.value || "২০১৫";

        if (userPhotoInput.files && userPhotoInput.files[0]) {
            const reader = new FileReader();
            reader.onload = function(e) {
                const userImg = new Image();
                userImg.onload = function() {
                    // ছবির বক্স পজিশন (আপনার টেমপ্লেট অনুযায়ী অ্যাডজাস্ট করা)
                    const x = 210, y = 225, w = 310, h = 330;
                    
                    // ছবি কভার মোডে ড্র করা (Crop & Fit)
                    let ratio = Math.max(w / userImg.width, h / userImg.height);
                    let centerShiftX = (w - userImg.width * ratio) / 2;
                    let centerShiftY = (h - userImg.height * ratio) / 2;
                    
                    ctx.save();
                    ctx.beginPath();
                    ctx.rect(x, y, w, h);
                    ctx.clip();
                    ctx.drawImage(userImg, 0, 0, userImg.width, userImg.height, x + centerShiftX, y + centerShiftY, userImg.width * ratio, userImg.height * ratio);
                    ctx.restore();

                    renderOverlay(name, batch);
                }
                userImg.src = e.target.result;
            }
            reader.readAsDataURL(userPhotoInput.files[0]);
        } else {
            renderOverlay(name, batch);
        }
    }

    function renderOverlay(name, batch) {
        // ১. ব্যাচ বাটন (অরেঞ্জ-রেড গ্রেডিয়েন্ট)
        const bx = 205, by = 605, bw = 165, bh = 65;
        const grad = ctx.createLinearGradient(bx, by, bx + bw, by);
        grad.addColorStop(0, "#ff8c00"); 
        grad.addColorStop(1, "#ed1c24"); 

        ctx.fillStyle = grad;
        // Rounded Rectangle
        ctx.beginPath();
        ctx.roundRect(bx, by, bw, bh, 35);
        ctx.fill();

        // ব্যাচ টেক্সট
        ctx.fillStyle = "#ffffff";
        ctx.font = "bold 35px 'SolaimanLipi', Arial";
        ctx.textAlign = "center";
        ctx.fillText(batch, bx + bw/2, by + 45);

        // ২. ইউজারের নাম
        ctx.fillStyle = "#1a2a3a"; // গাঢ় রঙ যেন ফুটে ওঠে
        ctx.font = "bold 42px 'SolaimanLipi', Arial";
        ctx.textAlign = "left";
        ctx.fillText(name, 385, 652);

        // প্রিভিউ ক্যানভাসে কপি করা
        pCtx.clearRect(0, 0, previewCanvas.width, previewCanvas.height);
        pCtx.drawImage(canvas, 0, 0);
    }

    // ইনপুট ইভেন্ট লিসেনার
    userNameInput.addEventListener('input', updateCanvas);
    userBatchInput.addEventListener('input', updateCanvas);
    userPhotoInput.addEventListener('change', updateCanvas);

    // ডাউনলোড বাটন
    downloadBtn.addEventListener('click', () => {
        const link = document.createElement('a');
        link.download = 'iftar_batch_banner.png';
        link.href = canvas.toDataURL('image/png', 1.0);
        link.click();
    });

</script>

</body>
</html>

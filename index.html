<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ইফতার ব্যানার</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;700&display=swap');
        
        body {
            font-family: 'Hind Siliguri', Arial, sans-serif;
            background-color: #f0f4f7;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .container {
            background: #fff;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 25px rgba(0,0,0,0.1);
            max-width: 500px;
            width: 100%;
            text-align: center;
        }
        h2 { color: #2c3e50; margin-bottom: 25px; }
        .form-group { margin-bottom: 15px; text-align: left; }
        label { display: block; margin-bottom: 8px; font-weight: bold; color: #444; }
        input[type="text"], input[type="file"] {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 15px;
        }
        .btn-generate {
            background: #d09e3b;
            color: white;
            border: none;
            padding: 15px;
            width: 100%;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            transition: 0.3s;
        }
        .btn-generate:hover { background: #b58932; }
        
        #resultArea {
            margin-top: 30px;
            display: none;
        }
        canvas {
            max-width: 100%;
            height: auto;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }
        .btn-download {
            display: inline-block;
            background: #d09e3b;
            color: white;
            text-decoration: none;
            padding: 12px 30px;
            border-radius: 50px;
            font-weight: bold;
            margin-top: 20px;
            font-size: 16px;
            cursor: pointer;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>ব্যানার ডিজাইন করুন</h2>
    
    <div class="form-group">
        <label>আপনার নাম:</label>
        <input type="text" id="userName" placeholder="নাম লিখুন">
    </div>
    
    <div class="form-group">
        <label>ব্যাচ:</label>
        <input type="text" id="userBatch" placeholder="উদা: ২০১৫">
    </div>
    
    <div class="form-group">
        <label>আপনার ছবি আপলোড করুন:</label>
        <input type="file" id="userPhoto" accept="image/*">
    </div>

    <button class="btn-generate" onclick="generateBanner()">ব্যানার তৈরি করুন</button>

    <div id="resultArea">
        <h3 style="color: #27ae60;">ব্যানারটি তৈরি হয়েছে!</h3>
        <canvas id="bannerCanvas" width="1000" height="1000"></canvas>
        <br>
        <a id="downloadLink" class="btn-download">ডাউনলোড করুন</a>
    </div>
</div>

<script>
    const canvas = document.getElementById('bannerCanvas');
    const ctx = canvas.getContext('2d');
    const templateImg = new Image();
    
    // টেম্পলেট ছবির পাথ (আপনার মূল ফাইলের নাম এখানে দিন)
    templateImg.src = 'template.jpg'; 

    function generateBanner() {
        const name = document.getElementById('userName').value;
        const batch = document.getElementById('userBatch').value;
        const photoInput = document.getElementById('userPhoto');

        if(!name || !batch || !photoInput.files[0]) {
            alert("অনুগ্রহ করে আপনার নাম, ব্যাচ এবং ছবি প্রদান করুন।");
            return;
        }

        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.drawImage(templateImg, 0, 0, canvas.width, canvas.height);

        const reader = new FileReader();
        reader.onload = function(event) {
            const userImg = new Image();
            userImg.onload = function() {
                // ৩. পজিশন সেটিংস (যদি ছবি ছোট বা বড় লাগে তবে x, y, w, h পরিবর্তন করুন)
                // ছবিকে বর্ডারের মাপ অনুযায়ী সেট করার জন্য সাইজ এবং পজিশন অ্যাডজাস্ট করা হয়েছে
                const x = 210, y = 225, w = 310, h = 330; 
                const radius = 10;
                const borderSize = 3;

                // ১. ক্লিপিং পাথ তৈরি (ছবিকে রাউন্ড করার জন্য)
                ctx.save();
                roundRectPath(ctx, x, y, w, h, radius);
                ctx.clip();

                // ২. ছবি ড্র করা
                let scale = Math.max(w / userImg.width, h / userImg.height);
                let xCenter = (w - userImg.width * scale) / 2;
                let yCenter = (h - userImg.height * scale) / 2;
                ctx.drawImage(userImg, x + xCenter, y + yCenter, userImg.width * scale, userImg.height * scale);
                ctx.restore();

                // ৩. ছবির বর্ডার ড্র করা (ছবির উপরে ৩ পিক্সেল বর্ডার)
                ctx.strokeStyle = "#d09e3b";
                ctx.lineWidth = borderSize;
                // ছবির চারপাশে বর্ডার সেট করার জন্য বর্ডারের মাপ অনুযায়ী x এবং y পজিশন অ্যাডজাস্ট করা হয়েছে
                roundRectPath(ctx, x - borderSize/2, y - borderSize/2, w + borderSize, h + borderSize, radius);
                ctx.stroke();

                // ৪. নাম এবং ব্যাচ ওভারলে ড্র করা
                drawTextOverlay(name, batch);

                document.getElementById('resultArea').style.display = 'block';
                const downloadLink = document.getElementById('downloadLink');
                downloadLink.href = canvas.toDataURL('image/png');
                downloadLink.download = name + '_banner.png';
                document.getElementById('resultArea').scrollIntoView({behavior: "smooth"});
            };
            userImg.src = event.target.result;
        };
        reader.readAsDataURL(photoInput.files[0]);
    }

    // রাউন্ডেড রেকট্যাঙ্গেল পাথ তৈরির ফাংশন (সব ব্রাউজারের জন্য)
    function roundRectPath(context, x, y, width, height, radius) {
        context.beginPath();
        context.moveTo(x + radius, y);
        context.lineTo(x + width - radius, y);
        context.quadraticCurveTo(x + width, y, x + width, y + radius);
        context.lineTo(x + width, y + height - radius);
        context.quadraticCurveTo(x + width, y + height, x + width - radius, y + height);
        context.lineTo(x + radius, y + height);
        context.quadraticCurveTo(x, y + height, x, y + height - radius);
        context.lineTo(x, y + radius);
        context.quadraticCurveTo(x, y, x + radius, y);
        context.closePath();
    }

    function drawTextOverlay(name, batch) {
        const bx = 205, by = 605, bw = 160, bh = 60;
        ctx.fillStyle = "#d09e3b";
        roundRectPath(ctx, bx, by, bw, bh, 30);
        ctx.fill();

        ctx.fillStyle = "white";
        ctx.font = "bold 30px Arial";
        ctx.textAlign = "center";
        ctx.fillText(batch, bx + bw/2, by + 40);

        ctx.fillStyle = "#2c3e50";
        ctx.font = "bold 40px Arial";
        ctx.textAlign = "left";
        ctx.fillText( name, 385, 650);
    }
</script>

</body>
</html>
